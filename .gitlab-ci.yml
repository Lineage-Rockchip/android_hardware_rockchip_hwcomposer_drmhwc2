stages:
  - build
  - test

before_script:
  # 所有作业执行前运行的脚本
  - echo "Setting up the environment"
  - export PATH=/home/lb/projects/gitlab-ci/drmhwc2-configs/build_sh/:/home/lb/projects/gitlab-ci/drmhwc2-configs/test_sh/:$PATH
  - echo "Updated PATH=$PATH"  # 打印修改后的 PATH

# 创建MR时自动构建单元测试
build_14_on_mr:
  stage: build
  tags:
    - android-14
  script:
    - echo "Building the Android-14 SDK ..."
    - . 14_build_drmhwc2_mr.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 每日构建自动化编译部分
build_15_on_schedule:
  stage: build
  tags:
    - android-15
  script:
    - echo "Building the Android-15 SDK ..."
    - . 15_build_drmhwc2.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'  # 只有通过 schedule 触发才执行
      when: always
    - when: never  # 其他所有情况都不执行

build_14_on_schedule:
  stage: build
  tags:
    - android-14
  script:
    - echo "Building the Android-14 SDK ..."
    - . 14_build_drmhwc2.sh
  only:
    - schedules  # 这个 job 仅在定时任务触发时执行

build_13_on_schedule:
  stage: build
  tags:
    - android-13
  script:
    - echo "Building the Android-14 SDK ..."
    - . 13_build_drmhwc2.sh
  only:
    - schedules  # 这个 job 仅在定时任务触发时执行

build_12_on_schedule:
  stage: build
  tags:
    - android-12
  script:
    - echo "Building the Android-14 SDK ..."
