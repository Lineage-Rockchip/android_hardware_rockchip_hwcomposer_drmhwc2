  script:
    - echo "Building the Android-14 SDK ..."
    - . 11_build_drmhwc2.sh
  only:
    - schedules  # 这个 job 仅在定时任务触发时执行

test_rk3588_14:
  stage: test
  tags:
    - android-14
  variables:
    GIT_STRATEGY: none  # 不拉取代码
  rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - echo "Test the Android-14 RK3588 ..."
    - . 14_test_drmhwc2.sh "14" "rk3588_u"

